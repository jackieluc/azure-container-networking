# Assembles the GitHub Release drop: every shippable archive under a single
# bins/ directory, published as one OneBranch artifact so that OneBranch
# generates and signs exactly one SBOM over the whole drop.
#
# The downstream Networking-Aquarius "Github Release" pipeline consumes this
# artifact and its 1ES source-build validation requires the SBOM to have been
# generated by the pipeline that produced the artifact.
jobs:
- job: output
  displayName: "Assemble Release Drop"
  pool:
    type: linux
  variables:
    ob_outputDirectory: $(Build.ArtifactStagingDirectory)
    ob_git_checkout: false
    LinuxContainerImage: 'onebranch.azurecr.io/linux/ubuntu-2404:latest'
    DEBIAN_FRONTEND: noninteractive
    ARCH: amd64
    REPO_ROOT: $(Build.SourcesDirectory)/drop_setup_env_source
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: "Download Source"
    inputs:
      targetPath: $(REPO_ROOT)
      artifact: drop_setup_env_source

  - task: ShellScript@2
    displayName: "Install crane"
    inputs:
      scriptPath: $(REPO_ROOT)/.pipelines/build/scripts/install-crane.sh

  - task: ShellScript@2
    displayName: "Install msft-go"
    inputs:
      scriptPath: $(REPO_ROOT)/.pipelines/build/scripts/install-go.sh

  - bash: |
      set -eux
      if ! command -v zip >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends zip
      fi
    displayName: "Ensure zip is available"

  - bash: |
      set -eux
      make all-binaries-platforms
    displayName: "Build all platform binaries"
    workingDirectory: $(REPO_ROOT)

  - bash: |
      set -eux
      mkdir -p "$(ob_outputDirectory)"/bins
      cd ./output
      find . -name '*.tgz' -print -exec mv -t "$(ob_outputDirectory)"/bins/ {} +
      find . -name '*.zip' -print -exec mv -t "$(ob_outputDirectory)"/bins/ {} +
      ls -la "$(ob_outputDirectory)"/bins
    displayName: "Stage release archives"
    workingDirectory: $(REPO_ROOT)
